{%- comment -%}
  Blog post preview card. Usage: {% include post-card.html post=post %}
{%- endcomment -%}
<article class="card">
  <h3 class="card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p class="card__meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time>
  </p>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 160 }}</p>
</article>
