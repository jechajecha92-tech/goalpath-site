<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <p class="site-footer__name">{{ site.author.name }}</p>
      <p class="site-footer__meta">
        {%- for pos in site.author.positions -%}
        {{ pos.title }}, {{ pos.institution }}{% unless forloop.last %} &middot; {% endunless %}
        {%- endfor -%}
      </p>
    </div>
    {% include profile-links.html context="footer" %}
    <p class="site-footer__copyright">
      &copy; {{ site.time | date: "%Y" }} {{ site.author.name }}.
      Built with <a href="https://jekyllrb.com/">Jekyll</a>.
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
