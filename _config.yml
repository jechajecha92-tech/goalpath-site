# Site settings
title: Jecha S Jecha
tagline: PhD Researcher in AI in Education
description: >-
  Personal academic website of Jecha S Jecha, PhD student at Southwest
  University researching artificial intelligence in education, AI adoption in
  higher education, and self-regulated learning.
url: "https://academic.goalpath.site"
baseurl: ""
lang: en
timezone: Asia/Shanghai

# Author profile (used across layouts, SEO, and structured data)
author:
  name: Jecha S Jecha
  photo: /assets/images/jecha.jpg
  email: jecha@zanvarsity.ac.tz          # institutional (primary)
  email_personal: jechasulieman@gmail.com
  wechat: Jecha_Jecha
  positions:
    - title: PhD Student in Educational Technology
      institution: Southwest University
      location: Chongqing, China
    - title: Assistant Lecturer, Faculty of Science
      institution: Zanzibar University
      location: Zanzibar, Tanzania
  dissertation: >-
    Designing an AI-Enhanced Scaffolding Model to Reduce Academic
    Procrastination Among Undergraduates at Zanzibar University: A
    Design-Based Research
  research_interests:
    - Artificial Intelligence in Education
    - Academic Procrastination
    - Self-Regulated Learning
    - AI Adoption in Higher Education
    - Educational Technology
    - Human-AI Interaction
  # Verified academic profiles
  orcid: "https://orcid.org/0000-0002-7784-0994"
  google_scholar: "https://scholar.google.com/citations?user=Hx_X6f8AAAAJ&hl=en"
  phone_china: "+86 193 3291 4873"
  phone_tanzania: "+255 776 752 905"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
permalink: /insights/:year/:month/:day/:title/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Files excluded from the generated site
exclude:
  - README.md
  - LICENSE
  - SPEC.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
