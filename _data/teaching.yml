# Teaching and supervision rendered on the teaching page.
# Course titles describe the author's teaching areas in the Faculty of
# Science, Zanzibar University. Add exact course codes when available.
courses:
  - code: IT102
    title: Computer Programming Methodology
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Foundations of programming and problem-solving — algorithms, control
      structures, and structured programming practice for early-stage IT
      students.
  - code: IT306
    title: Web Design, Programming and Administration
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Building and running web applications: front-end design, server-side
      programming, and the deployment and administration of web systems.
  - code: IT512
    title: ICT Teaching Methods
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Pedagogy for computing and ICT education — curriculum design,
      instructional strategies, and assessment for teaching technology.
  - code: IT513
    title: IT Project Management
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Planning and delivering IT projects: scope, scheduling, budgeting,
      risk, and leading project teams to completion.

supervision:
  - level: Undergraduate final-year projects
    institution: Zanzibar University, Faculty of Science
    topics: >-
      Information technology, AI adoption in higher education, and applied
      research projects, alongside assisting senior staff in supervising
      tutorials, seminars, and practicals.
