# Teaching and supervision rendered on the teaching page.
# Course titles describe the author's teaching areas in the Faculty of
# Science, Zanzibar University. Add exact course codes when available.
courses:
  - title: Information Technology (Faculty of Science)
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Lecturing and leading tutorials, seminars, and practical sessions in
      information technology within the Faculty of Science, including
      setting, marking, and invigilating university examinations.
  - title: Information Technology with Education
    institution: Zanzibar University
    level: Undergraduate
    role: Assistant Lecturer
    description: >-
      Teaching on the BSc in Information Technology with Education, connecting
      computing skills with classroom pedagogy for future educators.
  - title: Computer Skills Training
    institution: Various schools & institutions, Zanzibar
    level: Professional / short course
    role: Trainer
    description: >-
      Delivering practical computer and IT training courses, including AI
      training for academics and research-methods training.

supervision:
  - level: Undergraduate final-year projects
    institution: Zanzibar University, Faculty of Science
    topics: >-
      Information technology, AI adoption in higher education, and applied
      research projects, alongside assisting senior staff in supervising
      tutorials, seminars, and practicals.
