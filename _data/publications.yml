- title: "Generative AI and adaptive systems for customising help-seeking scaffolds: A systematic review"
  authors: "Jecha, J. S., Igweani, C. C., Banaras, A., Liang, Y., & Mwalyego, F. M."
  year: 2026
  type: journal
  status: "Published"
  venue: "Information Services and Use"
  featured: true
  doi: "https://doi.org/10.1177/18758789261486037"
  abstract: >-
    Help-seeking is crucial in self-regulated learning (SRL), yet generic
    scaffolds often fail to meet diverse learner needs. This PRISMA
    systematic review synthesises 48 empirical studies (2017–2025) on how AI
    — including large language models — customises help-seeking scaffolds,
    examining their effects relative to standard scaffolds and the
    methodological and ethical constraints, and identifies gaps for future
    SRL-focused AI support.
  bibtex: |
    @article{jecha2026genai,
      author  = {Jecha, Jecha S. and Igweani, Chimaobi Charles and
                 Banaras, Anum and Liang, Yu and Mwalyego, Faustin M.},
      title   = {Generative AI and adaptive systems for customising
                 help-seeking scaffolds: A systematic review},
      journal = {Information Services and Use},
      year    = {2026},
      doi     = {10.1177/18758789261486037}
    }

