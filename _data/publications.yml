- title: "When readiness fails: a TOE–TAM mixed-methods analysis of AI-enabled HR digitalization in a resource-constrained small island context"
  authors: "Jecha, J. S., Ali, A. K., & Mussa, A."
  year: 2026
  type: journal
  status: "Published"
  venue: "Frontiers in Artificial Intelligence, 9, 1902314"
  featured: true
  doi: "https://doi.org/10.3389/frai.2026.1902314"
  abstract: >-
    This study examines barriers to adopting AI in human resource management
    across Zanzibar's public and private sectors, testing an integrated
    Technology–Organization–Environment and Technology Acceptance (TOE–TAM)
    framework under mandatory, resource-constrained conditions. Using an
    explanatory sequential mixed-methods design — a survey of 137 HR
    professionals, IT managers, and administrators analysed with PLS-SEM,
    plus nine key-informant interviews — it finds that several standard
    readiness predictors do not behave as theorised, with implications for
    AI-HR adoption in small island developing states.
  bibtex: |
    @article{jecha2026readiness,
      author  = {Jecha, Jecha S. and Ali, Ally Khamis and Mussa, Adilu},
      title   = {When readiness fails: a TOE--TAM mixed-methods analysis of
                 AI-enabled HR digitalization in a resource-constrained
                 small island context},
      journal = {Frontiers in Artificial Intelligence},
      volume  = {9},
      pages   = {1902314},
      year    = {2026},
      doi     = {10.3389/frai.2026.1902314}
    }

- title: "Spatial distribution and health risk assessment of nitrate contamination in groundwater from rural and peri-urban areas of Zanzibar, Tanzania"
  authors: "Said, K. M., & Jecha, J. S."
  year: 2026
  type: journal
  status: "Published"
  venue: "Frontiers in Water, 8, 1886987"
  featured: true
  doi: "https://doi.org/10.3389/frwa.2026.1886987"
  abstract: >-
    Nitrate contamination of groundwater is a growing concern in tropical
    island settings, where shallow aquifers are the primary drinking-water
    source. This study assessed nitrate concentrations, their spatial
    distribution, compliance with drinking-water guidelines, and the
    associated non-carcinogenic health risk across 35 sampling wards in five
    districts of Unguja Island, Zanzibar, analysing 116 groundwater samples
    from wells and boreholes collected during a 2024 dry-season campaign.
  bibtex: |
    @article{said2026spatial,
